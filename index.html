<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>にじぼ Tech Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --bg2: #1a1d27;
      --bg3: #22263a;
      --accent: #6c8aff;
      --accent2: #a78bfa;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --border: #2d3248;
      --success: #34d399;
      --warn: #fbbf24;
      --radius: 12px;
      --font: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .site-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .site-title span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .site-sub {
      font-size: 0.8rem;
      color: var(--text2);
      margin-top: 2px;
    }

    nav { display: flex; gap: 20px; }
    nav a {
      color: var(--text2);
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--text); text-decoration: none; }

    /* ── Main layout ── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 32px;
    }

    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
    }

    /* ── Section titles ── */
    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    /* ── Posts list ── */
    .posts-area {}

    .post-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 14px;
      display: flex;
      gap: 16px;
      transition: border-color 0.2s, transform 0.15s;
      cursor: default;
    }
    .post-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .post-card a { color: var(--text); }
    .post-card a:hover { text-decoration: none; }

    .post-date-badge {
      min-width: 48px;
      text-align: center;
      padding-top: 4px;
    }
    .post-date-badge .month {
      font-size: 0.65rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .post-date-badge .day {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .post-content { flex: 1; }
    .post-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .post-summary {
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg3);
      color: var(--accent2);
      border: 1px solid var(--border);
    }

    /* ── 週次チェック表（横並び） ── */
    .week-check-wrap {
      overflow-x: auto;
      margin-bottom: 24px;
    }
    .week-check {
      border-collapse: collapse;
      min-width: 100%;
      table-layout: fixed;
    }
    .week-check th, .week-check td {
      text-align: center;
      padding: 8px 4px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .week-check .row-label {
      font-size: 0.7rem;
      color: var(--text2);
      background: var(--bg3);
      width: 52px;
      border-right: 1px solid var(--border);
    }
    .week-check .row-num  { font-size: 0.72rem; color: var(--text2); }
    .week-check .row-date { color: var(--text); }
    .week-check .row-result { font-size: 1.1rem; font-weight: 700; height: 36px; }
    .status-ok { color: var(--success); }
    .status-ng { color: #ef4444; }

    /* ── Sidebar ── */
    .sidebar {}

    /* Calendar */
    .calendar-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .cal-month-label { font-size: 0.95rem; font-weight: 600; }
    .cal-nav {
      background: none;
      border: 1px solid var(--border);
      color: var(--text2);
      width: 28px; height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .cal-nav:hover { border-color: var(--accent); color: var(--accent); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-dow {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text2);
      padding: 4px 0;
      font-weight: 600;
    }
    .cal-day {
      text-align: center;
      font-size: 0.78rem;
      padding: 6px 2px;
      border-radius: 6px;
      cursor: default;
    }
    .cal-day.empty { opacity: 0 ; pointer-events: none; }
    .cal-day.today {
      background: var(--bg3);
      color: var(--text);
      font-weight: 700;
    }
    .cal-day.has-post {
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .cal-day.has-post:hover { opacity: 0.8; }
    .cal-day.planned {
      background: var(--bg3);
      color: var(--warn);
      border: 1px dashed var(--warn);
      font-size: 0.7rem;
    }

    /* Progress card */
    .progress-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .progress-label { font-size: 0.82rem; color: var(--text2); }
    .progress-count { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .progress-bar-bg {
      background: var(--bg3);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    /* Info card */
    .info-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.7;
    }
    .info-card strong { color: var(--text); }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.75rem;
      color: var(--text2);
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

  </style>
</head>
<body>

<header>
  <div>
    <div class="site-title">にじぼ <span>Tech Notes</span></div>
    <div class="site-sub">フロントエンドエンジニアのアウトプット記録</div>
  </div>
  <nav>
    <a href="index.html">ホーム</a>
  </nav>
</header>

<div class="container">

  <!-- Left: Posts -->
  <main class="posts-area">

    <!-- 週次チェック表（横並び） -->
    <div class="section-title">📋 週次チェック</div>
    <div class="week-check-wrap" style="margin-bottom:28px;">
      <table class="week-check" id="check-table">
        <tbody>
          <tr id="row-num"></tr>
          <tr id="row-date"></tr>
          <tr id="row-result"></tr>
        </tbody>
      </table>
    </div>

    <div class="section-title">📝 アウトプット一覧</div>

    <!-- 投稿済みリスト (URLができたら href を追加する) -->
    <div id="posts-list"></div>

  </main>

  <!-- Right: Sidebar -->
  <aside class="sidebar">

    <!-- Calendar -->
    <div class="calendar-card">
      <div class="section-title">📅 カレンダー</div>
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <div class="cal-month-label" id="cal-month-label"></div>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <!-- Progress -->
    <div class="progress-card">
      <div class="section-title">🎯 進捗</div>
      <div class="progress-row">
        <span class="progress-label">投稿済み</span>
        <span class="progress-count" id="prog-done">0</span>
      </div>
      <div class="progress-bar-bg" style="margin-bottom:12px">
        <div class="progress-bar-fill" id="prog-bar" style="width:0%"></div>
      </div>
      <div style="font-size:0.78rem; color:var(--text2);">
        目標: 隔週1件 / 期末まで最低 <strong style="color:var(--text)">9件</strong>
      </div>
    </div>

    <!-- Info -->
    <div class="info-card">
      <strong>投稿ルール</strong><br>
      ① 記事等を紹介する場合は単なるリンクではなく<br>
      　 「内容の要約」+「自分の考え/業務への活用案」を添える<br>
      ② スライド1枚相当のアウトプット量を目安にする<br>
      ③ 隔週金曜日を投稿日の目安にする
    </div>

  </aside>
</div>

<footer>
  © 2026 にじぼ Tech Notes
</footer>

<script>
  // ───────────────────────────────────────────
  //  投稿データ（投稿したら追加していく）
  //  { date: "YYYY-MM-DD", title: "", summary: "", url: "", tags: [] }
  // ───────────────────────────────────────────
  const POSTS = [
    {
      date: "2026-06-23",
      title: "AIに「初見」でコードを読ませてみる — CLAUDE.md自動生成で見えた「言い切れること」と「要確認」の境界線",
      summary: "サンプルプロジェクトをAIに初見で読ませ、CLAUDE.md形式の引き継ぎ資料を自動生成。コードから断定できることと「要確認」とした項目の境界線から、引き継ぎ・委任の実務への活かし方を考える。",
      url: "weekly/004.html",
      tags: ["AI活用", "ドキュメント", "引き継ぎ", "CLAUDE.md"]
    },
    {
      date: "2026-06-09",
      title: "CoworkとAsanaで「管理」を変える — 自分にも、チームにも使えるAI × PMツール活用",
      summary: "Cowork＋AsanaのMCP連携でタスク管理がどう変わるか。セルフマネジメントとチーム管理の両面から、使ってみて感じた可能性と現実的な課題を整理。",
      url: "weekly/003.html",
      tags: ["Cowork", "Asana", "マネジメント", "AI活用"]
    },
    {
      date: "2026-06-02",
      title: "Claude CodeとCursor、Figmaとの相性はどちらが上？ — 同じデザインデータで実際に試して比べた",
      summary: "同じFigmaデザインを使いClaude CodeとCursorで実装を比較。1回の指示で完了するClaude Codeと、MCP制限で途中終了したCursorの差が明確に。",
      url: "weekly/002.html",
      tags: ["Claude Code", "Cursor", "Figma", "MCP"]
    },
    {
      date: "2026-05-25",
      title: "バイブコーディングをCoworkで試してみた — コードを書かずにサイトを作る、どこまでいける？",
      summary: "Coworkへの指示だけでにじぼ Tech Notesを構築。バイブコーディングの実践から見えた業務活用の可能性と注意点。",
      url: "weekly/001.html",
      tags: ["Claude", "Cowork", "バイブコーディング", "AI活用"]
    },
  ];

  // ───────────────────────────────────────────
  //  予定投稿日（隔週金曜）
  // ───────────────────────────────────────────
  const PLANNED_DATES = [
    "2026-05-29",
    "2026-06-12",
    "2026-06-26",
    "2026-07-10",
    "2026-07-24",
    "2026-08-07",
    "2026-08-21",
    "2026-09-04",
    "2026-09-18",
  ];

  // ── 投稿済み日付セット ──
  const postedDates = new Set(POSTS.map(p => p.date));
  const plannedSet  = new Set(PLANNED_DATES.filter(d => !postedDates.has(d)));

  // ── カレンダー ──
  const MONTHS_JP = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const DAYS_JP   = ["日","月","火","水","木","金","土"];

  let calYear, calMonth;
  const today = new Date();
  calYear  = today.getFullYear();
  calMonth = today.getMonth(); // 0-indexed

  function renderCalendar() {
    const label = document.getElementById("cal-month-label");
    const grid  = document.getElementById("cal-grid");
    label.textContent = `${calYear}年 ${MONTHS_JP[calMonth]}`;

    // Day-of-week headers
    let html = DAYS_JP.map(d => `<div class="cal-dow">${d}</div>`).join("");

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const lastDate = new Date(calYear, calMonth + 1, 0).getDate();

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;

    // Date cells
    for (let d = 1; d <= lastDate; d++) {
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const isToday = (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
      const hasPost = postedDates.has(dateStr);
      const isPlanned = plannedSet.has(dateStr);

      let cls = "cal-day";
      let onclick = "";
      if (hasPost) {
        const post = POSTS.find(p => p.date === dateStr);
        cls += " has-post";
        onclick = `onclick="location.href='${post.url}'"`;
      } else if (isPlanned) {
        cls += " planned";
      } else if (isToday) {
        cls += " today";
      }

      html += `<div class="${cls}" ${onclick} title="${dateStr}">${d}</div>`;
    }

    grid.innerHTML = html;
  }

  document.getElementById("cal-prev").addEventListener("click", () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click", () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });

  renderCalendar();

  // ── 投稿リスト描画 ──
  function renderPosts() {
    const list = document.getElementById("posts-list");

    if (POSTS.length === 0) {
      list.innerHTML = `<div style="color:var(--text2);font-size:0.9rem;padding:16px 0;">
        まだ投稿がありません。最初のアウトプットを作成しましょう！
      </div>`;
    } else {
      list.innerHTML = POSTS.sort((a,b) => b.date.localeCompare(a.date)).map(p => {
        const dt = new Date(p.date);
        const mon = MONTHS_JP[dt.getMonth()];
        const day = dt.getDate();
        const tags = (p.tags||[]).map(t => `<span class="tag">${t}</span>`).join("");
        return `
          <a href="${p.url}" style="display:block; text-decoration:none;">
            <div class="post-card">
              <div class="post-date-badge">
                <div class="month">${mon}</div>
                <div class="day">${day}</div>
              </div>
              <div class="post-content">
                <div class="post-title">${p.title}</div>
                <div class="post-summary">${p.summary || ""}</div>
                <div class="tags">${tags}</div>
              </div>
            </div>
          </a>`;
      }).join("");
    }

  }

  renderPosts();

  // ── 進捗バー ──
  function renderProgress() {
    const total = 9;
    const done  = POSTS.length;
    const pct   = Math.min(Math.round(done / total * 100), 100);
    document.getElementById("prog-done").textContent = `${done} / ${total}件`;
    document.getElementById("prog-bar").style.width  = `${pct}%`;
  }

  renderProgress();

  // ── 週次チェック表（横並び） ──
  function getMondayOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function renderCheckTable() {
    const now = new Date();
    now.setHours(23, 59, 59, 999);

    const rowNum    = document.getElementById("row-num");
    const rowDate   = document.getElementById("row-date");
    const rowResult = document.getElementById("row-result");

    // ラベル列
    const labelNum    = `<td class="row-label">回次</td>`;
    const labelDate   = `<td class="row-label">投稿予定日</td>`;
    const labelResult = `<td class="row-label">結果</td>`;

    let cellsNum = "", cellsDate = "", cellsResult = "";

    PLANNED_DATES.forEach((dateStr, i) => {
      const planned = new Date(dateStr);
      const monday  = getMondayOfWeek(planned);
      const sunday  = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23, 59, 59, 999);

      const label = `${planned.getMonth()+1}/${planned.getDate()}`;

      // 投稿済みか確認（投稿があれば即○）
      const posted = POSTS.some(p => {
        const pd = new Date(p.date);
        return pd >= monday && pd <= sunday;
      });

      // 予定日を過ぎて未投稿なら✗、予定日前は空白
      const plannedEnd = new Date(dateStr);
      plannedEnd.setHours(23, 59, 59, 999);

      let resultHtml = "";
      if (posted) {
        resultHtml = `<span class="status-ok">○</span>`;
      } else if (plannedEnd <= now) {
        resultHtml = `<span class="status-ng">✗</span>`;
      }

      cellsNum    += `<td class="row-num">第${i+1}回</td>`;
      cellsDate   += `<td class="row-date">${label}</td>`;
      cellsResult += `<td class="row-result">${resultHtml}</td>`;
    });

    rowNum.innerHTML    = labelNum    + cellsNum;
    rowDate.innerHTML   = labelDate   + cellsDate;
    rowResult.innerHTML = labelResult + cellsResult;
  }

  renderCheckTable();

</script>

</body>
</html>
